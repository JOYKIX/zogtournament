<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zog Tournament Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section id="loginSection" class="card">
        <h1>Compte</h1>
        <p id="connectionStatus" class="message"></p>
        <div class="grid two-columns auth-grid">
          <form id="createProfileForm" class="panel">
            <h2>Créer un profil</h2>
            <p class="hint">Maximum 2 comptes sur le site.</p>

            <label for="newUsername">Identifiant</label>
            <input id="newUsername" name="newUsername" type="text" required />

            <label for="newPassword">Mot de passe</label>
            <input id="newPassword" name="newPassword" type="password" required />

            <button type="submit">Créer le compte</button>
            <p id="createProfileMessage" class="message"></p>
          </form>

          <form id="loginForm" class="panel">
            <h2>Connexion</h2>

            <label for="username">Identifiant</label>
            <input id="username" name="username" type="text" required />

            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" required />

            <button type="submit">Se connecter</button>
            <p id="loginMessage" class="message"></p>
          </form>
        </div>
      </section>

      <section id="appSection" class="card hidden">
        <header class="toolbar">
          <div>
            <h2>Créateur d'arbre de tournoi</h2>
            <p class="hint">Gère les participants, modifie-les puis diffuse l'overlay en mode duel ou arbre.</p>
          </div>
          <button id="logoutBtn" class="secondary">Déconnexion</button>
        </header>

        <div class="grid two-columns">
          <form id="participantForm" class="panel">
            <h3 id="participantFormTitle">Ajouter un participant</h3>
            <input id="editParticipantId" name="editParticipantId" type="hidden" />

            <label for="pseudo">Pseudo</label>
            <input id="pseudo" name="pseudo" type="text" required />

            <label for="character">Perso</label>
            <input id="character" name="character" type="text" required />

            <label for="image">Image (URL)</label>
            <input id="image" name="image" type="url" placeholder="https://..." />

            <div class="actions stacked-mobile">
              <button id="participantSubmitBtn" type="submit">Ajouter</button>
              <button id="cancelEditBtn" type="button" class="secondary hidden">Annuler modification</button>
            </div>
            <p id="participantMessage" class="message"></p>
          </form>

          <section class="panel">
            <header class="toolbar compact">
              <h3>Participants</h3>
              <button id="clearParticipantsBtn" type="button" class="danger ghost">Vider</button>
            </header>
            <ul id="participantsList" class="list"></ul>
          </section>
        </div>

        <section class="panel">
          <header class="toolbar wrap">
            <h3>Arbre de tournoi</h3>
            <div class="actions wrap bracket-controls">
              <label for="bracketSizeSelect" class="size-label">Format</label>
              <select id="bracketSizeSelect" class="size-select" aria-label="Taille du bracket">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8" selected>8</option>
                <option value="16">16</option>
                <option value="32">32</option>
                <option value="64">64</option>
              </select>
              <button id="generateBracketBtn" class="secondary">Générer les matchs</button>
              <button id="overlayPrevBtn" class="secondary">◀ Match précédent</button>
              <button id="overlayNextBtn" class="secondary">Match suivant ▶</button>
              <button id="openDuelOverlayBtn">Ouvrir overlay duel</button>
              <button id="openTreeOverlayBtn" class="secondary">Ouvrir overlay arbre</button>
            </div>
          </header>
          <div id="bracketContainer" class="bracket"></div>
        </section>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
