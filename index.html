<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zog Tournament Builder</title>
    <link rel="stylesheet" href="assets/styles/dashboard.css" />
  </head>
  <body>
    <main class="container">
      <section id="loginSection" class="card auth-card">
        <header class="auth-header">
          <p class="eyebrow">Zog Tournament</p>
          <h1>Gestion pro des tournois</h1>
          <p id="connectionStatus" class="message"></p>
        </header>

        <div class="grid two-columns auth-grid">
          <form id="createProfileForm" class="panel glass-panel">
            <h2>Créer un profil</h2>
            <p class="hint">Maximum 2 comptes sur le site.</p>

            <label for="newUsername">Identifiant</label>
            <input id="newUsername" name="newUsername" type="text" required />

            <label for="newPassword">Mot de passe</label>
            <input id="newPassword" name="newPassword" type="password" required />

            <button type="submit">Créer le compte</button>
            <p id="createProfileMessage" class="message"></p>
          </form>

          <form id="loginForm" class="panel glass-panel">
            <h2>Connexion</h2>

            <label for="username">Identifiant</label>
            <input id="username" name="username" type="text" required />

            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" required />

            <button type="submit">Se connecter</button>
            <p id="loginMessage" class="message"></p>
          </form>
        </div>
      </section>

      <section id="appSection" class="hidden app-layout">
        <header class="card app-header">
          <div>
            <p class="eyebrow">Dashboard tournoi</p>
            <h2>Dashboard tournoi</h2>
          </div>
          <div class="actions wrap">
            <button id="openDuelOverlayBtn">Overlay duel</button>
            <button id="openTreeOverlayBtn" class="secondary">Overlay arbre</button>
            <button id="logoutBtn" class="secondary">Déconnexion</button>
          </div>
        </header>

        <section class="grid dashboard-grid">
          <form id="participantForm" class="card panel">
            <h3 id="participantFormTitle">Ajouter un participant</h3>
            <input id="editParticipantId" name="editParticipantId" type="hidden" />

            <label for="pseudo">Pseudo</label>
            <input id="pseudo" name="pseudo" type="text" required />

            <label for="character">Perso</label>
            <input id="character" name="character" type="text" required />

            <label for="image">Image (URL)</label>
            <input id="image" name="image" type="url" placeholder="https://..." />

            <div class="actions stacked-mobile">
              <button id="participantSubmitBtn" type="submit">Ajouter</button>
              <button id="cancelEditBtn" type="button" class="secondary hidden">Annuler modification</button>
            </div>
            <p id="participantMessage" class="message"></p>
          </form>

          <section class="card panel">
            <header class="toolbar compact">
              <h3>Participants</h3>
              <button id="clearParticipantsBtn" type="button" class="danger ghost">Vider</button>
            </header>
            <ul id="participantsList" class="list"></ul>
          </section>
        </section>

        <section class="card panel">
          <header class="toolbar wrap bracket-header">
            <div>
              <h3>Arbre de tournoi</h3>
            </div>
            <div class="actions wrap bracket-controls">
              <button id="generateBracketBtn" class="secondary">Créer le tournoi</button>
              <button id="overlayPrevBtn" class="secondary">◀ Match précédent</button>
              <button id="overlayNextBtn" class="secondary">Match suivant ▶</button>
            </div>
          </header>
          <div id="bracketContainer" class="bracket"></div>
        </section>
      </section>
    </main>

    <script type="module" src="app/pages/dashboard.js"></script>
  </body>
</html>
