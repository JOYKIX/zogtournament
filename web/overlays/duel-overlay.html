<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay duel</title>
    <link rel="stylesheet" href="../../assets/styles/overlay-duel.css" />
  </head>
  <body>
    <main class="overlay-root">
      <section class="duel-timers" aria-label="Comptes à rebours">
        <article class="timer-box" id="timerParticipant1">
          <p class="timer-label" id="timerP1Label">Joueur 1</p>
          <p class="timer-value" id="timerP1Value">05:00</p>
          <div class="timer-health-shell" aria-hidden="true">
            <div class="timer-health-trail" id="timerP1HealthTrail"></div>
            <div class="timer-health-fill" id="timerP1HealthFill"></div>
          </div>
        </article>
        <article class="timer-center" id="timerCenterBox" aria-hidden="true">
          <p class="timer-center-value" id="timerCenterValue">VS</p>
        </article>
        <article class="timer-box" id="timerParticipant2">
          <p class="timer-label" id="timerP2Label">Joueur 2</p>
          <p class="timer-value" id="timerP2Value">05:00</p>
          <div class="timer-health-shell" aria-hidden="true">
            <div class="timer-health-trail" id="timerP2HealthTrail"></div>
            <div class="timer-health-fill" id="timerP2HealthFill"></div>
          </div>
        </article>
      </section>
      <section class="duel-view">
        <section class="fighter fighter-left" id="leftFighter"></section>
        <section class="fighter fighter-right" id="rightFighter"></section>
      </section>
    </main>

    <script type="module" src="../../app/pages/overlay-duel.js"></script>
  </body>
</html>
