<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZogQuiz · Buzzer</title>
    <link rel="stylesheet" href="../assets/styles/dashboard.css" />
  </head>
  <body>
    <main class="container">
      <section class="card" style="max-width: 760px; margin: 0 auto; display:grid; gap:.8rem;">
        <header class="section-head">
          <p class="eyebrow">ZogQuiz</p>
          <h3>Buzzer invité</h3>
        </header>

        <form id="buzzerJoinForm" class="sub-card">
          <label for="inviteCode">Code d'invitation</label>
          <input id="inviteCode" required />
          <label for="buzzerPseudo">Pseudo</label>
          <input id="buzzerPseudo" required />
          <button type="submit">Rejoindre</button>
          <p id="buzzerMessage" class="message"></p>
        </form>

        <section id="buzzerPanel" class="sub-card hidden">
          <p id="buzzerStatus" class="countdown-pill">Prêt à buzzer.</p>
          <button id="buzzBtn" type="button" style="font-size:1.3rem; padding:1rem;">BUZZ (Espace)</button>
        </section>
      </section>
    </main>
    <script type="module" src="../app/pages/buzzer.js"></script>
  </body>
</html>
