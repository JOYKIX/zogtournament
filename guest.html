<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invité caméra + micro</title>
    <link rel="stylesheet" href="assets/styles/dashboard.css" />
  </head>
  <body>
    <main class="container">
      <section class="card panel section-card" style="max-width:720px;margin:2rem auto;">
        <header class="section-head">
          <p class="eyebrow">Invité</p>
          <h3>Rejoindre la régie caméra + micro</h3>
        </header>
        <label class="setting-field" for="guestName">Pseudo</label>
        <input id="guestName" type="text" placeholder="Votre pseudo" maxlength="24" />
        <div class="actions wrap">
          <button id="enableCameraBtn" type="button">Activer caméra + micro</button>
          <button id="joinGuestBtn" type="button" class="secondary">Rejoindre</button>
          <button id="leaveGuestBtn" type="button" class="ghost">Quitter</button>
        </div>
        <p id="guestStatus" class="message">En attente</p>
        <video id="guestPreview" autoplay playsinline muted style="width:100%;border-radius:12px;background:#060a16;min-height:240px;"></video>
      </section>
    </main>
    <script type="module" src="app/pages/guest-cam.js"></script>
  </body>
</html>
