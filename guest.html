<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invité caméra + micro</title>
    <link rel="stylesheet" href="assets/styles/dashboard.css" />
    <link rel="stylesheet" href="assets/styles/guest.css" />
  </head>
  <body>
    <main class="guest-shell">
      <section class="voice-stage card panel" aria-label="Salon vocal principal">
        <header class="section-head stage-head">
          <div>
            <p class="eyebrow">Espace invité</p>
            <h3>Vocal groupe unique</h3>
          </div>
          <p id="guestStatus" class="message">En attente</p>
        </header>

        <div class="stage-video-wrap">
          <video id="guestPreview" autoplay playsinline muted class="stage-video"></video>
          <div class="video-badge">Vous êtes en direct</div>
        </div>

        <div class="settings-grid two-cols compact-grid">
          <div>
            <label class="setting-field" for="guestName">Pseudo</label>
            <input id="guestName" type="text" placeholder="Votre pseudo" maxlength="24" />
          </div>
          <div>
            <label class="setting-field" for="microphoneSelect">Microphone</label>
            <select id="microphoneSelect">
              <option value="">Micro par défaut</option>
            </select>
          </div>
        </div>
        <div class="actions wrap stage-controls">
          <button id="enableCameraBtn" type="button">Activer caméra + micro</button>
          <button id="muteMicrophoneBtn" type="button" class="secondary" disabled>Mute</button>
          <button id="joinStreamBtn" type="button" class="secondary">Se connecter au flux</button>
          <button id="joinVoiceBtn" type="button" class="secondary">Se connecter au groupe vocal</button>
          <button id="refreshMicrophonesBtn" type="button" class="ghost">Rafraîchir les micros</button>
          <button id="leaveGuestBtn" type="button" class="ghost">Quitter</button>
        </div>

        <div id="guestVoicePeers" aria-hidden="true"></div>
      </section>

      <aside class="online-panel card" aria-label="Membres en ligne">
        <header class="panel-head">
          <p class="eyebrow">Groupe vocal</p>
          <h2>Membres en ligne</h2>
        </header>
        <p class="panel-hint">Un seul groupe est disponible. Les membres apparaissent dès qu'ils rejoignent.</p>
        <ul id="guestPeerList" class="member-list">
          <li class="member-empty">Personne connecté pour le moment</li>
        </ul>
      </aside>
    </main>
    <script type="module" src="app/pages/guest-cam.js"></script>
  </body>
</html>
