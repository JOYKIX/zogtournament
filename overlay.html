<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Duel</title>
    <link rel="stylesheet" href="assets/styles/overlay-duel.css" />
  </head>
  <body>
    <main class="overlay-root">
      <section class="duel-timers" aria-label="Comptes à rebours">
        <article class="timer-box" id="timerParticipant1">
          <p class="timer-label">Participant 1</p>
          <p class="timer-value" id="timerP1Value">05:00</p>
        </article>
        <article class="timer-box" id="timerParticipant2">
          <p class="timer-label">Participant 2</p>
          <p class="timer-value" id="timerP2Value">05:00</p>
        </article>
      </section>
      <section class="duel-view">
        <section class="fighter fighter-left" id="leftFighter"></section>
        <section class="fighter fighter-right" id="rightFighter"></section>
      </section>
    </main>

    <script type="module" src="app/pages/overlay-duel.js"></script>
  </body>
</html>
