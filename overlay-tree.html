<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Arbre</title>
    <link rel="stylesheet" href="assets/styles/overlay-tree.css" />
  </head>
  <body>
    <main class="tree-root">
      <header class="tree-title-wrap">
        <h2>Arbre du tournoi</h2>
      </header>
      <div id="overlayTreeContainer" class="tree-grid"></div>
      <section class="guest-cams-layer" aria-label="Caméras et micros invités">
        <article class="guest-slot" id="guestSlot1">
          <video id="guestVideo1" autoplay playsinline muted></video>
          <audio id="guestAudio1" autoplay playsinline></audio>
        </article>
        <article class="guest-slot" id="guestSlot2">
          <video id="guestVideo2" autoplay playsinline muted></video>
          <audio id="guestAudio2" autoplay playsinline></audio>
        </article>
        <article class="guest-slot" id="guestSlot3">
          <video id="guestVideo3" autoplay playsinline muted></video>
          <audio id="guestAudio3" autoplay playsinline></audio>
        </article>
      </section>
    </main>

    <script type="module" src="app/pages/overlay-tree.js"></script>
  </body>
</html>
